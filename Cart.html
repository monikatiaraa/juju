<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang – Miu Miu</title>
  <link rel="stylesheet" href="style(2).css">
  <link href="Cart(6).html" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="brand">✦ Miu Miu</div>
    <ul class="menu">
      <a href="Index(2).html" class="btn-nav">Home</a>
      <a href="My_Glasses(2).html" class="btn-nav">Glasses</a>
      <a href="My_Bag(2).html" class="btn-nav">Bags</a>
      <a href="My_Heels(2).html" class="btn-nav">Heels</a>
      <a href="Cart(6).html" class="btn-nav btn-cart">🛒 <span class="cart-count" id="cartCount">0</span></a>
    </ul>
  </nav>

  <section class="cart-section">
    <div class="section-tag" style="display:block;margin-bottom:8px;">✦ My Shopping</div>
    <h1>Keranjang Belanja</h1>
    <div id="cartContent"></div>
  </section>

  <script>
    function getCart() { return JSON.parse(localStorage.getItem('miumiu_cart') || '[]'); }
    function saveCart(c) { localStorage.setItem('miumiu_cart', JSON.stringify(c)); }
    function parsePrice(p) { return parseFloat(p.replace(/[^0-9.]/g,'')) || 0; }
    const IDR = n => 'Rp ' + n.toLocaleString('id-ID');

    function updateCount() {
      document.getElementById('cartCount').textContent = getCart().reduce((s,i)=>s+i.qty,0);
    }

    function changeQty(idx, delta) {
      const cart = getCart();
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      saveCart(cart); render();
    }

    function removeItem(idx) {
      const cart = getCart();
      cart.splice(idx, 1);
      saveCart(cart); render();
    }

    function render() {
      const cart = getCart();
      updateCount();
      const el = document.getElementById('cartContent');
      if (!cart.length) {
        el.innerHTML = '<div class="empty-cart"><p>🌸 Keranjangmu masih kosong...</p><a href="My_Glasses.html" class="btn-primary">Mulai Belanja &rarr;</a></div>';
        return;
      }
      const sub = cart.reduce((s,i)=>s+parsePrice(i.price)*i.qty,0)*15000;
      const ship = 15000;
      el.innerHTML = `<div class="cart-grid">
        <div class="cart-items">${cart.map((item,idx)=>`
          <div class="cart-item">
            <img src="${item.img}" alt="${item.name}">
            <div class="cart-item-info">
              <h3>${item.name}</h3><p class="cat">${item.cat||''}</p>
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="changeQty(${idx},-1)">&#8722;</button>
                <span class="qty-num">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
              <span class="item-price">${IDR(parsePrice(item.price)*item.qty*15000)}</span>
              <button class="remove-btn" onclick="removeItem(${idx})">&#x2715;</button>
            </div>
          </div>`).join('')}
        </div>
        <div class="cart-summary">
          <h2>Ringkasan Pesanan</h2>
          <div class="summary-row"><span>Subtotal (${cart.reduce((s,i)=>s+i.qty,0)} item)</span><span>${IDR(sub)}</span></div>
          <div class="summary-row"><span>Estimasi Ongkir</span><span>${IDR(ship)}</span></div>
          <hr class="summary-divider">
          <div class="summary-total"><span>Total</span><span>${IDR(sub+ship)}</span></div>
          <button class="btn-checkout" onclick="window.location.href='Checkout.html'">Lanjut ke Pembayaran &rarr;</button>
          <a href="My_Glasses.html" style="display:block;text-align:center;margin-top:14px;font-size:13px;color:#c4a0b8;text-decoration:none;">&#8592; Lanjut Belanja</a>
        </div>
      </div>`;
    }
    render();
  </script>
</body>
</html>
